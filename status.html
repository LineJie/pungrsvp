<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Cek Status Booking — Pung Pung Mahjong</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #F5F0E8; --green-dark: #1C3A2E; --green-mid: #2D5A45;
    --gold: #C9A84C; --gold-light: #E8C97A; --warm-white: #FDFAF4;
    --text-muted: #7A7060; --red: #C0392B;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { background:#1a1a1a; display:flex; justify-content:center; min-height:100vh; font-family:'DM Sans',sans-serif; }
  .phone-frame { width:390px; min-height:100vh; background:var(--cream); overflow-y:auto; }

  .header {
    background:var(--green-dark); padding:32px 20px 36px;
    text-align:center; position:relative;
  }
  .back-link {
    position:absolute; left:16px; top:20px;
    color:rgba(255,255,255,0.6); text-decoration:none; font-size:13px;
  }
  .header-title {
    font-family:'Playfair Display',serif; color:white; font-size:22px; font-weight:700; margin-bottom:4px;
  }
  .header-sub { font-size:12px; color:rgba(255,255,255,0.5); }
  .curve { height:24px; background:var(--green-dark); position:relative; }
  .curve::after { content:''; position:absolute; bottom:0; left:0; right:0; height:24px; background:var(--cream); border-radius:24px 24px 0 0; }

  .content { padding:8px 16px 40px; }

  .search-card {
    background:var(--warm-white); border-radius:20px; padding:20px; margin-bottom:16px;
    box-shadow:0 2px 12px rgba(28,58,46,0.07);
  }
  .search-label { font-size:11px; font-weight:600; color:var(--text-muted); letter-spacing:1.2px; text-transform:uppercase; margin-bottom:10px; }
  .search-row { display:flex; gap:8px; }
  .code-input {
    flex:1; padding:12px 14px; border:1.5px solid rgba(28,58,46,0.12); border-radius:12px;
    font-family:'DM Sans',sans-serif; font-size:14px; font-weight:600; color:var(--green-dark);
    background:var(--cream); outline:none; letter-spacing:1.5px; text-transform:uppercase;
  }
  .code-input:focus { border-color:var(--green-mid); }
  .search-btn {
    padding:12px 18px; background:var(--green-dark); border:none; border-radius:12px;
    color:var(--gold-light); font-family:'DM Sans',sans-serif; font-size:13px; font-weight:600;
    cursor:pointer; white-space:nowrap;
  }

  .result-card {
    background:var(--warm-white); border-radius:20px; padding:20px;
    box-shadow:0 2px 12px rgba(28,58,46,0.07); display:none;
  }
  .result-card.show { display:block; }

  .status-banner {
    border-radius:14px; padding:14px 16px; text-align:center; margin-bottom:16px;
  }
  .status-banner.pending { background:rgba(201,168,76,0.15); }
  .status-banner.confirmed { background:rgba(74,140,104,0.12); }
  .status-banner.cancelled { background:rgba(192,57,43,0.08); }
  .status-banner.checked_in { background:rgba(74,140,104,0.12); }
  .status-banner.completed { background:rgba(122,112,96,0.12); }
  .status-icon { font-size:32px; margin-bottom:6px; }
  .status-text { font-family:'Playfair Display',serif; font-size:17px; font-weight:700; }
  .status-text.pending { color:#9A7520; }
  .status-text.confirmed { color:var(--green-mid); }
  .status-text.cancelled { color:var(--red); }
  .status-text.checked_in { color:var(--green-mid); }
  .status-text.completed { color:var(--text-muted); }
  .status-sub { font-size:12px; color:var(--text-muted); margin-top:4px; }

  .detail-row { display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid rgba(28,58,46,0.06); font-size:13px; }
  .detail-row:last-child { border-bottom:none; }
  .detail-key { color:var(--text-muted); }
  .detail-val { font-weight:600; color:var(--green-dark); text-align:right; }

  .code-display {
    background:var(--green-dark); border-radius:12px; padding:12px 16px;
    text-align:center; margin-bottom:14px;
  }
  .code-display .lbl { font-size:10px; color:rgba(255,255,255,0.5); letter-spacing:1px; text-transform:uppercase; margin-bottom:4px; }
  .code-display .code { font-family:'Playfair Display',serif; font-size:22px; font-weight:700; color:var(--gold-light); letter-spacing:3px; }

  .mahjong-btn {
    display:none; width:100%; padding:14px; background:var(--green-dark); border:none; border-radius:14px;
    font-family:'DM Sans',sans-serif; font-size:14px; font-weight:600; color:var(--gold-light);
    cursor:pointer; margin-top:14px;
  }
  .mahjong-btn.show { display:block; }
  .mahjong-hint { font-size:11px; color:var(--text-muted); text-align:center; margin-top:8px; }

  .wa-btn {
    width:100%; padding:14px; background:var(--gold); border:none; border-radius:14px;
    font-family:'DM Sans',sans-serif; font-size:14px; font-weight:600; color:var(--green-dark);
    cursor:pointer; margin-top:14px;
  }

  .error-msg { text-align:center; color:var(--red); font-size:13px; padding:20px; display:none; }
  .error-msg.show { display:block; }
    .leaderboard-link-btn { display:block; width:100%; padding:14px; background:transparent; border:1.5px solid rgba(28,58,46,0.2); border-radius:14px; font-family:'DM Sans',sans-serif; font-size:14px; font-weight:600; color:var(--green-dark); cursor:pointer; margin-bottom:16px; text-align:center; text-decoration:none; }
</style>
</head>
<body>
<div class="phone-frame">
  <div class="header">
    <a href="/" class="back-link">← Booking</a>
    <div style="font-size:28px;margin-bottom:8px;">🎫</div>
    <div class="header-title">Cek Status Booking</div>
    <div class="header-sub">Masukkan kode booking kamu</div>
  </div>
  <div class="curve"></div>

  <div class="content">
    <div class="search-card">
      <div class="search-label">Kode Booking</div>
      <div class="search-row">
        <input type="text" class="code-input" id="codeInput" placeholder="PP-XXXXXX" maxlength="9"
          oninput="this.value=this.value.toUpperCase()"
          onkeydown="if(event.key==='Enter')checkStatus()">
        <button class="search-btn" onclick="checkStatus()">Cek →</button>
      </div>
    </div>
        <button class="leaderboard-link-btn" onclick="window.location.href='/mahjong.html?leaderboard=1'">&#x1F3C6; Lihat Leaderboard</button>

    <div class="error-msg" id="errorMsg">❌ Kode booking tidak ditemukan. Periksa kembali kode kamu.</div>

    <div class="result-card" id="resultCard">
      <div class="code-display">
        <div class="lbl">Kode Booking</div>
        <div class="code" id="resCode"></div>
      </div>

      <div class="status-banner" id="statusBanner">
        <div class="status-icon" id="statusIcon"></div>
        <div class="status-text" id="statusText"></div>
        <div class="status-sub" id="statusSub"></div>
      </div>

      <div id="detailRows"></div>

      <button class="mahjong-btn" id="mahjongBtn">&#x1F004; Buka Mahjong Score</button>
      <div class="mahjong-hint" id="mahjongHint" style="display:none">Sudah check-in? Catat skor Mahjong kamu di sini!</div>

      <button class="wa-btn" id="waBtn">💬 Hubungi Pung Pung via WA</button>
    </div>
  </div>
</div>

<script>
  // Rekening & WA per cabang. Surabaya = BCA Teresa Carolina, Denpasar/Bali = Mandiri Rika A.
  // Harus tetap sinkron dengan REKENING di index.html — kalau salah satu diubah, ubah juga yang satunya.
  const REKENING = {
    surabaya: { bank: 'BCA', number: '8630038775', name: 'Teresa Carolina', wa: '628999880707' },
    denpasar: { bank: 'Mandiri', number: '1450014635755', name: 'Rika A', wa: '6288231360817' }
  };

  // Tarif per meja — HARUS sinkron dengan TABLE_RATES di netlify/functions/bookings.ts.
  // Default Rp 50.000/jam, kecuali Autumn Table (b3, meja manual Denpasar) Rp 30.000/jam.
  const TABLE_RATES = { b3: 30000 };
  function getHourlyRate(tableId) {
    return (tableId && TABLE_RATES[tableId] !== undefined) ? TABLE_RATES[tableId] : 50000;
  }

  async function checkStatus() {
    const code = document.getElementById('codeInput').value.trim().toUpperCase();
    if (!code || code.length < 6) { alert('Masukkan kode booking yang valid ya!'); return; }

    document.getElementById('errorMsg').classList.remove('show');
    document.getElementById('resultCard').classList.remove('show');

    try {
      const res = await fetch(`/api/bookings?code=${code}`);
      if (!res.ok) { document.getElementById('errorMsg').classList.add('show'); return; }
      const b = await res.json();
      if (b.error) { document.getElementById('errorMsg').classList.add('show'); return; }
      showResult(b);
    } catch(e) {
      document.getElementById('errorMsg').classList.add('show');
    }
  }

  const STATUS_META = {
    confirmed: { icon: '✅', text: 'Booking Confirmed!', sub: 'Meja kamu sudah terkonfirmasi. Sampai jumpa!' },
    pending: { icon: '⏳', text: 'Menunggu Pembayaran', sub: 'Silakan transfer ke BCA 8630038775 dan kirim bukti ke WA kami' },
    checked_in: { icon: '\u{1F004}', text: 'Sudah Check-in!', sub: 'Selamat bermain! Yuk catat skor Mahjong kamu di bawah.' },
    completed: { icon: '\u{1F3C1}', text: 'Sesi Selesai', sub: 'Terima kasih sudah bermain di Pung Pung. Sampai jumpa lagi!' },
    cancelled: { icon: '❌', text: 'Booking Dibatalkan', sub: 'Booking ini telah dibatalkan. Hubungi kami untuk info lebih lanjut.' },
  };
  function showResult(b) {
    document.getElementById('resCode').textContent = b.bookingCode;

    const banner = document.getElementById('statusBanner');
    const icon = document.getElementById('statusIcon');
    const text = document.getElementById('statusText');
    const sub = document.getElementById('statusSub');

    banner.className = `status-banner ${b.status}`;
  const meta = STATUS_META[b.status] || STATUS_META.cancelled;
    icon.textContent = meta.icon;
    text.className = `status-text ${b.status}`;
    text.textContent = meta.text;
    const rek = REKENING[b.location] || REKENING.surabaya;
    sub.textContent = b.status === 'pending'
      ? `Silakan transfer ke ${rek.bank} ${rek.number} a.n. ${rek.name} dan kirim bukti ke WA kami`
      : meta.sub;

    // Format date
    const [y,m,d] = b.date.split('-');
    const months = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
    const dateStr = `${d} ${months[parseInt(m)-1]} ${y}`;

    document.getElementById('detailRows').innerHTML = `
      <div class="detail-row"><span class="detail-key">Nama</span><span class="detail-val">${escHtml(b.customerName)}</span></div>
      <div class="detail-row"><span class="detail-key">Tanggal</span><span class="detail-val">${dateStr}</span></div>
      <div class="detail-row"><span class="detail-key">Waktu</span><span class="detail-val">${b.time} WIB</span></div>
      <div class="detail-row"><span class="detail-key">Meja</span><span class="detail-val">${escHtml(b.tableName)}<br><span style="font-size:11px;font-weight:400;color:var(--text-muted)">${escHtml(b.floor)}</span></span></div>
      <div class="detail-row"><span class="detail-key">Durasi</span><span class="detail-val">${b.duration} jam</span></div>
      <div class="detail-row"><span class="detail-key">Total</span><span class="detail-val" style="color:var(--gold)">Rp ${(typeof b.totalPaid === 'number' ? b.totalPaid : (getHourlyRate(b.tableId) * b.duration)).toLocaleString('id-ID')}</span></div>
      ${b.notes ? `<div class="detail-row"><span class="detail-key">Catatan</span><span class="detail-val">${escHtml(b.notes)}</span></div>` : ''}
    `;

    const mahjongBtn = document.getElementById('mahjongBtn');
    const mahjongHint = document.getElementById('mahjongHint');
    if (b.status === 'checked_in') {
      mahjongBtn.classList.add('show');
      mahjongHint.style.display = 'none';
      mahjongBtn.onclick = () => { window.location.href = `/mahjong.html?code=${encodeURIComponent(b.bookingCode)}`; };
    } else {
      mahjongBtn.classList.remove('show');
      mahjongHint.style.display = (b.status === 'confirmed' || b.status === 'pending') ? 'block' : 'none';
    }

    const waMsg = `Halo Pung Pung! Saya mau tanya status booking saya.\\nKode: ${b.bookingCode}\\nNama: ${b.customerName}`;
    document.getElementById('waBtn').onclick = () => window.open(`https://wa.me/${rek.wa}?text=${encodeURIComponent(waMsg)}`, '_blank');
    document.getElementById('resultCard').classList.add('show');
  }

  function escHtml(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // Auto-check if code in URL param
  const urlCode = new URLSearchParams(window.location.search).get('code');
  if (urlCode) { document.getElementById('codeInput').value = urlCode.toUpperCase(); checkStatus(); }
</script>
</body>
</html>
